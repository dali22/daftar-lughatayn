name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk daftar-lughatayn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daftar-lughatayn-apk
          path: daftar-lughatayn.apk
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" daftar-lughatayn.apk \
            --title "دفتر لغتين v1.0.${{ github.run_number }}" \
            --notes "APK Android. Télécharge daftar-lughatayn.apk depuis le téléphone et installe-le." --latest
